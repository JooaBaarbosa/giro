services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-giro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-giro}
      POSTGRES_DB: giro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-giro} -d giro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
