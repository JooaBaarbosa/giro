# `docker compose up` funciona sem .env (tudo tem padrão e o WhatsApp fica em dry-run).
# Para personalizar, copie .env.example para .env.
x-whatsapp-env: &whatsapp-env
  OWNER_WHATSAPP: ${OWNER_WHATSAPP:-+5511900000000}
  WHATSAPP_DRY_RUN: ${WHATSAPP_DRY_RUN:-true}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
  WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-v23.0}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-giro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-giro}
      POSTGRES_DB: giro
    ports:
      - "127.0.0.1:5432:5432"  # só nesta máquina: senha padrão giro/giro
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-n8n.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-giro} -d giro"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      <<: *whatsapp-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-giro}:${POSTGRES_PASSWORD:-giro}@postgres:5432/giro
      SERVICE_TOKEN: ${SERVICE_TOKEN:-troque-este-token}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      STORE_NAME: ${STORE_NAME:-Mercearia Demo}
      STORE_TZ: ${STORE_TZ:-America/Sao_Paulo}
      SEED_DEMO: ${SEED_DEMO:-true}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 20

  n8n:
    image: n8nio/n8n:2.44.6
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"  # só nesta máquina: o n8n enxerga os tokens do .env
    entrypoint: ["/bin/sh", "/scripts/n8n-entrypoint.sh"]
    environment:
      <<: *whatsapp-env
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-giro}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-giro}
      GENERIC_TIMEZONE: ${STORE_TZ:-America/Sao_Paulo}
      TZ: ${STORE_TZ:-America/Sao_Paulo}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      API_URL: http://api:8000
      SERVICE_TOKEN: ${SERVICE_TOKEN:-troque-este-token}
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./docker/n8n-entrypoint.sh:/scripts/n8n-entrypoint.sh:ro

volumes:
  pgdata:
  n8ndata:
